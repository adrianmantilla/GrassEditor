name: Pruebas sin Maya

on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # el Python de Maya 2026 y 2027
      - name: Pruebas
        run: python -m unittest discover -s tests -v

  paquete:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP para alumnos
        run: python3 herramientas/empaquetar.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: Pradera-para-alumnos
          path: dist/*.zip
